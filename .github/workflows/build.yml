name: Build KuroYomi APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Kusa itong bubuo ng Gradle Wrapper at APK nang hindi kailangan ng local AIDE
      - name: Build Debug APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload KuroYomi APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroYomi-App-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
