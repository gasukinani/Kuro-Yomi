name: Build KuroYomi APK (Auto-Fixer Edition)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # ========================================================
      # 🛠️ MASTER AUTO-FIXER: Aayusin lahat ng errors bago mag-build
      # ========================================================
      - name: Master Auto-Fixer Script
        run: |
          echo "=== 1. Gumagawa ng malinis na gradle.properties ==="
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "=== 2. Auto-Inject ng CardView Dependency kung sakaling kulang ==="
          if [ -f app/build.gradle.kts ]; then
            if ! grep -q "cardview" app/build.gradle.kts; then
              sed -i '/dependencies {/a \    implementation("androidx.cardview:cardview:1.0.0")' app/build.gradle.kts
              echo "Added CardView dependency!"
            fi
            # I-disable ang Lint abort para hindi huminto ang build sa warnings
            if ! grep -q "abortOnError" app/build.gradle.kts; then
              sed -i '/android {/a \    lint { abortOnError = false; checkReleaseBuilds = false }' app/build.gradle.kts
              echo "Disabled lint abort!"
            fi
          fi

          echo "=== 3. Tinatanggal ang private icon error sa AndroidManifest ==="
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i '/sym_def_app_icon/d' app/src/main/AndroidManifest.xml || true
          fi

          echo "=== 4. Bumubuo ng official Gradle 8.5 Wrapper ==="
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

          echo "=== All Auto-Fixes Applied Successfully! ==="

      # ========================================================
      # 🚀 COMPILATION STEP
      # ========================================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ========================================================
      # 📦 ARTIFACT UPLOAD
      # ========================================================
      - name: Upload KuroYomi APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroYomi-Full-Reader-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
