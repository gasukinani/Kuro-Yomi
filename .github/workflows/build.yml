name: Build KuroYomi APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Naka-disable ang cache para maiwasan ang "Services not available" error ng GitHub
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # Auto-Fix Script: Kusa nitong aayusin ang configuration bago mag-build
      - name: Auto-fix Project Files & Config
        run: |
          echo "Setting up proper gradle.properties..."
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "Fixing AndroidManifest private icon..."
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i '/android:icon="@android:drawable\/sym_def_app_icon"/d' app/src/main/AndroidManifest.xml || true
          fi

          echo "Generating Gradle 8.5 Wrapper..."
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      # Pag-compile ng APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Pag-upload ng APK para ma-download
      - name: Upload KuroYomi APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroYomi-App-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
